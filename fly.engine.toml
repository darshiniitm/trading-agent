# Fly.io config for the screening engine (docs/netlify-production-plan.md §5.1, decision D1).
# Not deployed yet; this is the recommended shape. Create the app and volume first:
#   fly apps create <app-name>            # then set `app` below
#   fly volumes create engine_data --region bom --size 3
#   fly secrets set ENGINE_TOKEN=<random> SUPABASE_DB_URL=... OTEL_EXPORTER_OTLP_ENDPOINT=... OTEL_EXPORTER_OTLP_HEADERS=...
#   fly deploy --config fly.engine.toml
app = "prompt-screener-engine"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.engine"

[env]
  PORT = "8080"
  ENGINE_DATA_DIR = "/data"
  OTEL_SERVICE_NAME = "prompt-screener-engine"

[mounts]
  source = "engine_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # warm-up (loading ~220 MB of parquet into memory) is slow, so the machine must never scale to zero
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
