# Docker Swarm stack for the screening engine on one VM — docs/engine-swarm-deploy-plan.md.
# Variables (ENGINE_IMAGE, JOBS_IMAGE, GIT_SHA, ENGINE_DOMAIN, ACME_EMAIL, OTEL_EXPORTER_OTLP_ENDPOINT, CADDYFILE_HASH) come from the shell that runs
# `docker stack deploy`; deploy.sh sources /srv/screener/stack.env first (Swarm does not read .env files itself).
version: "3.8"

networks:
  screener:
    driver: overlay
    attachable: true

volumes:
  caddy_data: {}
  caddy_config: {}

secrets:
  engine_token:    { external: true }   # bearer token the web app sends
  supabase_db_url: { external: true }   # engine telemetry (Session pooler :5432)
  app_db_url:      { external: true }   # weekly jobs (Transaction pooler :6543)
  otlp_headers:    { external: true }   # Grafana Cloud "Authorization=Basic …"
  api_pepper:      { external: true }   # hashes per-user plugin API keys (engine/apikeys.py)

configs:
  # configs are immutable: name by content hash so a changed Caddyfile deploys as a new config
  caddyfile:
    file: ./Caddyfile
    name: caddyfile_${CADDYFILE_HASH}

services:
  engine:
    image: ${ENGINE_IMAGE}
    networks: [screener]
    environment:
      PORT: "8080"
      ENGINE_DATA_DIR: /data
      OTEL_SERVICE_NAME: prompt-screener-engine
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      ENGINE_GIT_SHA: ${GIT_SHA}
    secrets:
      - { source: engine_token,    target: ENGINE_TOKEN }
      - { source: supabase_db_url, target: SUPABASE_DB_URL }
      - { source: otlp_headers,    target: OTEL_EXPORTER_OTLP_HEADERS }
      - { source: api_pepper,      target: API_PEPPER }
    volumes:
      - type: bind
        source: /srv/screener/data
        target: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s   # warm-up loads ~220 MB of parquet and builds indexes; measure in S3 and adjust
    deploy:
      replicas: 1          # NEVER more than 1: single-flight lock and refresh slot are per process, data_cache/ has one writer
      update_config:
        order: stop-first  # old engine fully stops before the new one starts: never two writers on /data
        failure_action: rollback
        monitor: 360s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      resources:
        limits:       { memory: 3G }
        reservations: { memory: 1500M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2.8   # pin an exact minor; bump deliberately
    networks: [screener]
    ports:
      - { target: 80,  published: 80,  mode: host }
      - { target: 443, published: 443, mode: host }
    configs:
      - { source: caddyfile, target: /etc/caddy/Caddyfile }
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ENGINE_DOMAIN: ${ENGINE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    deploy:
      replicas: 1
      restart_policy: { condition: any }

  jobs:
    image: ${JOBS_IMAGE}
    networks: [screener]
    environment:
      ENGINE_BASE_URL: http://engine:8080   # stays inside the overlay network, no TLS hop
      OTEL_SERVICE_NAME: prompt-screener-jobs
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    secrets:
      - { source: app_db_url,   target: APP_DB_URL }
      - { source: app_db_url,   target: TELEMETRY_DB_URL }
      - { source: engine_token, target: ENGINE_TOKEN }
      - { source: otlp_headers, target: OTEL_EXPORTER_OTLP_HEADERS }
    deploy:
      replicas: 0   # only the host timer starts it (run-weekly-jobs.sh)
      restart_policy: { condition: none }
